    btnAutoRefineCV.addEventListener('click', () => {
      if (state.frames.length < 2) {
        showToast('请至少载入两张图片以进行微调匹配');
        return;
      }
      const curIdx = state.activeFrameIndex;
      if (curIdx === 0) {
        showToast('当前已是基准图，请选中图 2 或图 3 执行精细匹配');
        return;
      }

      const cur = state.frames[curIdx];
      const prev = state.frames[curIdx - 1] || state.frames[0];
      if (!cur.anchorA || !prev.anchorA) {
        showToast('请先手动标定大致的“点 A”');
        return;
      }

      showToast('正在计算特征滑窗匹配...');

      const tSize = 64;
      const sRadius = 16;

      const tCanvas = document.createElement('canvas');
      tCanvas.width = tSize;
      tCanvas.height = tSize;
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(prev.image, prev.anchorA.x - tSize/2, prev.anchorA.y - tSize/2, tSize, tSize, 0, 0, tSize, tSize);
      const tData = tCtx.getImageData(0, 0, tSize, tSize).data;

      const sSize = tSize + sRadius * 2;
      const sCanvas = document.createElement('canvas');
      sCanvas.width = sSize;
      sCanvas.height = sSize;
      const sCtx = sCanvas.getContext('2d');
      sCtx.drawImage(cur.image, cur.anchorA.x - sSize/2, cur.anchorA.y - sSize/2, sSize, sSize, 0, 0, sSize, sSize);
      const sData = sCtx.getImageData(0, 0, sSize, sSize).data;

      function getGray(d, i) {
        return d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
      }

      let minDiff = Infinity;
      let bestDx = 0;
      let bestDy = 0;

      for (let dy = -sRadius; dy <= sRadius; dy++) {
        for (let dx = -sRadius; dx <= sRadius; dx++) {
          let diff = 0;
          for (let ty = 4; ty < tSize - 4; ty += 2) {
            for (let tx = 4; tx < tSize - 4; tx += 2) {
              const tIdx = (ty * tSize + tx) * 4;
              const sx = tx + dx + sRadius;
              const sy = ty + dy + sRadius;
              const sIdx = (sy * sSize + sx) * 4;
              const d = getGray(tData, tIdx) - getGray(sData, sIdx);
              diff += d * d;
            }
          }
          if (diff < minDiff) {
            minDiff = diff;
            bestDx = dx;
            bestDy = dy;
          }
        }
      }

      cur.anchorA.x += bestDx;
      cur.anchorA.y += bestDy;
      recomputeFrameTransform(cur);
      saveHistorySnapshot('自动微调误差');
      syncSidebarLayerModeUI();
      renderFrameList();
      redraw();
      showToast(`已消除误差偏移: Δ(${bestDx > 0 ? '+' : ''}${bestDx}px, ${bestDy > 0 ? '+' : ''}${bestDy}px)`);
    });

    function renderFrameList() {
      frameCountSpan.textContent = state.frames.length;
      document.getElementById('sidebarEmptyNotice').style.display = state.frames.length ? 'none' : 'flex';
      canvasEmptyState.style.display = state.frames.length ? 'none' : 'flex';
      nudgeOverlay.style.display = state.frames.length ? 'flex' : 'none';

      const alignedCount = state.frames.filter(f => {
        if (!f.anchorA) return false;
        if (f.mode === '2point' && !f.anchorB) return false;
        return true;
      }).length;
      alignProgressSpan.textContent = `${alignedCount} / ${state.frames.length}`;

      frameList.innerHTML = '';
      state.frames.forEach((frame, idx) => {
        const isBase = (idx === 0);
        const isActive = (idx === state.activeFrameIndex);
        const isVisible = (frame.visible !== false);

        const card = document.createElement('div');
        card.draggable = !isBase;
        card.className = `p-2 rounded border text-xs cursor-pointer transition flex items-center gap-2 ${
          isActive 
            ? 'bg-ink-100/90 border-ink-900 shadow-sm' 
            : 'bg-white hover:bg-ink-50 border-ink-200 text-ink-700'
        } ${!isVisible ? 'opacity-40' : ''}`;

        card.innerHTML = `
          <button class="btn-toggle-vis p-1 rounded hover:bg-ink-200 text-ink-500 hover:text-ink-900 shrink-0" title="${isVisible ? '隐藏此图层' : '显示此图层'}">
            <i data-lucide="${isVisible ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5 pointer-events-none"></i>
          </button>

          <div class="w-8 h-8 rounded bg-ink-100 overflow-hidden shrink-0 border border-ink-200 flex items-center justify-center">
            <img src="${frame.image.src}" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <span class="font-medium truncate text-ink-900 text-[11px]">${frame.name}</span>
              <span class="text-[9px] font-mono text-ink-400">${isBase ? '基准' : (frame.mode === '2point' ? '2点' : '1点')}</span>
            </div>
            <div class="text-[9px] text-ink-400 mt-0.5 flex items-center gap-2 font-mono">
              <span class="${frame.anchorA ? 'text-ink-800' : 'text-ink-300'}">A:${frame.anchorA ? `${frame.anchorA.x},${frame.anchorA.y}` : '-'}</span>
              ${frame.mode === '2point' ? `<span class="${frame.anchorB ? 'text-ink-800' : 'text-ink-300'}">B:${frame.anchorB ? `${frame.anchorB.x},${frame.anchorB.y}` : '-'}</span>` : ''}
            </div>
          </div>
          ${!isBase ? `
            <button class="btn-delete p-1 rounded hover:bg-rose-50 hover:text-rose-600 text-ink-300" title="删除">
              <i data-lucide="trash" class="w-3 h-3 pointer-events-none"></i>
            </button>
          ` : ''}
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-delete') || e.target.closest('.btn-toggle-vis')) return;
          state.activeFrameIndex = idx;
          state.currentPickPoint = (frame.anchorA === null) ? 'A' : (frame.mode === '2point' && frame.anchorB === null ? 'B' : 'A');
          syncSidebarLayerModeUI();
          renderFrameList();
          redraw();
        });

        card.querySelector('.btn-toggle-vis').addEventListener('click', (e) => {
          e.stopPropagation();
          frame.visible = !isVisible;
          saveHistorySnapshot(frame.visible ? '显示图层' : '隐藏图层');
          renderFrameList();
          redraw();
        });

        const delBtn = card.querySelector('.btn-delete');
        if (delBtn) {
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            saveHistorySnapshot('删除帧');
            state.frames.splice(idx, 1);
            if (state.activeFrameIndex >= state.frames.length) {
              state.activeFrameIndex = Math.max(0, state.frames.length - 1);
            }
            syncSidebarLayerModeUI();
            renderFrameList();
            redraw();
          });
        }

        if (!isBase) {
          card.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', idx));
          card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('border-t-2', 'border-t-ink-900'); });
          card.addEventListener('dragleave', () => card.classList.remove('border-t-2', 'border-t-ink-900'));
          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('border-t-2', 'border-t-ink-900');
            const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (fromIdx !== idx && fromIdx !== 0 && idx !== 0) {
              const moved = state.frames.splice(fromIdx, 1)[0];
              state.frames.splice(idx, 0, moved);
              state.activeFrameIndex = idx;
              saveHistorySnapshot('拖拽排序');
              renderFrameList();
              redraw();
            }
          });
        }

        frameList.appendChild(card);
      });

      lucide.createIcons();
      updateCoordLabels();
    }

    function updateCoordLabels() {
      const activeFrame = state.frames[state.activeFrameIndex];
      if (activeFrame && activeFrame.anchorA) {
        currentAnchorCoords.textContent = `${activeFrame.anchorA.x}, ${activeFrame.anchorA.y}`;
        currentAnchorBCoords.textContent = activeFrame.anchorB ? `${activeFrame.anchorB.x}, ${activeFrame.anchorB.y}` : '未设';
        const scalePct = ((activeFrame.scale || 1.0) * 100).toFixed(0);
        currentOffsetCoords.textContent = `Δ(${activeFrame.offset.x}, ${activeFrame.offset.y}) · ${scalePct}%`;
      } else {
        currentAnchorCoords.textContent = '未设';
        currentAnchorBCoords.textContent = '未设';
        currentOffsetCoords.textContent = 'Δ(0, 0)';
      }
      cropDimLabel.textContent = `${Math.round(state.cropRect.w)} × ${Math.round(state.cropRect.h)} px`;
    }

    function resetViewCamera() {
      if (!state.frames.length) return;
      const base = state.frames[0];
      const wrapW = viewportWrap.clientWidth || 800;
      const wrapH = viewportWrap.clientHeight || 600;
      const margin = 50;

      const scaleX = (wrapW - margin) / base.image.naturalWidth;
      const scaleY = (wrapH - margin) / base.image.naturalHeight;
      const bestZoom = Math.min(1.0, scaleX, scaleY);

      state.camera.zoom = Math.max(0.1, bestZoom);
      state.camera.x = Math.round((wrapW - base.image.naturalWidth * state.camera.zoom) / 2);
      state.camera.y = Math.round((wrapH - base.image.naturalHeight * state.camera.zoom) / 2);

      zoomPercentLabel.textContent = `${Math.round(state.camera.zoom * 100)}%`;
    }

    function clientToBaseCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      const xOnCanvas = clientX - rect.left;
      const yOnCanvas = clientY - rect.top;
      return {
        x: (xOnCanvas - state.camera.x) / state.camera.zoom,
        y: (yOnCanvas - state.camera.y) / state.camera.zoom
      };
    }

    function baseToCanvasCoords(imgX, imgY) {
      return {
        x: imgX * state.camera.zoom + state.camera.x,
        y: imgY * state.camera.zoom + state.camera.y
      };
    }

    function resizeCanvasToDisplay() {
      const dpr = window.devicePixelRatio || 1;
      const width = viewportWrap.clientWidth;
      const height = viewportWrap.clientHeight;
      if (!width || !height) return;

      if (mainCanvas.width !== Math.floor(width * dpr) || mainCanvas.height !== Math.floor(height * dpr)) {
        mainCanvas.width = Math.floor(width * dpr);
        mainCanvas.height = Math.floor(height * dpr);
        mainCanvas.style.width = width + 'px';
        mainCanvas.style.height = height + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawFrameWithTransform(targetCtx, frame, opacity = 1.0, isWorkspace = true) {
      if (!frame || !frame.image || frame.visible === false) return;
      const baseFrame = state.frames[0];
      if (!baseFrame) return;

      targetCtx.save();
      targetCtx.globalAlpha = opacity;

      if (isWorkspace) {
        targetCtx.translate(state.camera.x, state.camera.y);
        targetCtx.scale(state.camera.zoom, state.camera.zoom);
      }

      if (frame === baseFrame) {
        targetCtx.drawImage(frame.image, 0, 0);
        targetCtx.restore();
        return;
      }

      const baseA = baseFrame.anchorA || { x: 0, y: 0 };
      const curA = frame.anchorA || baseA;

      if (frame.mode === '2point' && frame.anchorB && baseFrame.anchorB) {
        targetCtx.translate(baseA.x, baseA.y);
        if (frame.allowRotation && frame.angle) targetCtx.rotate(frame.angle);
        if (frame.scale) targetCtx.scale(frame.scale, frame.scale);
        targetCtx.translate(-curA.x, -curA.y);
        targetCtx.drawImage(frame.image, 0, 0);
      } else {
        const dx = baseA.x - curA.x;
        const dy = baseA.y - curA.y;
        targetCtx.drawImage(frame.image, dx, dy);
      }

      targetCtx.restore();
    }

    // 辅助：绘制箭头
    function drawArrowhead(c, fromX, fromY, toX, toY, strokeWidth) {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const headlen = Math.max(8, strokeWidth * 3.5);
      c.save();
      c.beginPath();
      c.moveTo(toX, toY);
      c.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      c.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      c.closePath();
      c.fillStyle = c.strokeStyle;
      c.fill();
      c.restore();
    }

    // 绘制矢量图形 (线、曲线、面域)
    function drawVectorGraphics(targetCtx, isWorkspace = true) {
      if (!state.drawItems.length && !state.currentDrawingItem) return;

      targetCtx.save();
      if (isWorkspace) {
        targetCtx.translate(state.camera.x, state.camera.y);
        targetCtx.scale(state.camera.zoom, state.camera.zoom);
      }

      const allItems = [...state.drawItems];
      if (state.currentDrawingItem) allItems.push(state.currentDrawingItem);

      allItems.forEach(item => {
        if (!item.points || item.points.length < 2) return;
        targetCtx.save();
        targetCtx.lineWidth = item.strokeWidth;
        targetCtx.strokeStyle = item.strokeColor;
        targetCtx.fillStyle = item.fillColor || 'transparent';
        targetCtx.lineCap = 'round';
        targetCtx.lineJoin = 'round';

        // 线型（实线/虚线）对所有绘图对象全局生效
        if (state.drawParams.solidLine) {
          targetCtx.setLineDash([]);
        } else {
          targetCtx.setLineDash([item.strokeWidth * 3, item.strokeWidth * 2]);
        }

        const pts = item.points;

        if (item.type === 'line' || item.type === 'dashed') {
          targetCtx.beginPath();
          targetCtx.moveTo(pts[0].x, pts[0].y);
          targetCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          targetCtx.stroke();
          if (state.drawParams.hasArrow) {
            drawArrowhead(targetCtx, pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y, item.strokeWidth);
          }
        } else if (item.type === 'curve') {
          targetCtx.beginPath();
          targetCtx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length - 1; i++) {
            const xc = (pts[i].x + pts[i + 1].x) / 2;
            const yc = (pts[i].y + pts[i + 1].y) / 2;
            targetCtx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
          }
          targetCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          targetCtx.stroke();
          if (state.drawParams.hasArrow && pts.length >= 2) {
            const last = pts[pts.length - 1];
            const prev = pts[pts.length - 2];
            drawArrowhead(targetCtx, prev.x, prev.y, last.x, last.y, item.strokeWidth);
          }
        } else if (item.type === 'rect') {
          const x = Math.min(pts[0].x, pts[1].x);
          const y = Math.min(pts[0].y, pts[1].y);
          const w = Math.abs(pts[1].x - pts[0].x);
          const h = Math.abs(pts[1].y - pts[0].y);
          if (item.fillEnabled) targetCtx.fillRect(x, y, w, h);
          targetCtx.strokeRect(x, y, w, h);
        } else if (item.type === 'circle') {
          const r = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          targetCtx.beginPath();
          targetCtx.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2);
          if (item.fillEnabled) targetCtx.fill();
          targetCtx.stroke();
        } else if (item.type === 'polygon') {
          targetCtx.beginPath();
          targetCtx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) targetCtx.lineTo(pts[i].x, pts[i].y);
          // 仅显式闭合的才闭合成面（点回起点闭合）；绘制中与双击结束的保持开放多段线
          if (item.closed === true) {
            targetCtx.closePath();
            if (item.fillEnabled) targetCtx.fill();
          }
          targetCtx.stroke();
          // 开放多段线可按全局箭头开关加末端箭头
          if (item.closed !== true && state.drawParams.hasArrow && pts.length >= 2) {
            const last = pts[pts.length - 1];
            const prev = pts[pts.length - 2];
            drawArrowhead(targetCtx, prev.x, prev.y, last.x, last.y, item.strokeWidth);
          }
        }

        // 选中高亮边框 + 缩放手柄
        if (isWorkspace && state.selectedDrawId === item.id) {
          targetCtx.save();
          targetCtx.setLineDash([3, 3]);
          targetCtx.strokeStyle = '#2563eb';
          targetCtx.lineWidth = 1;
          const bbox = getDrawItemBBox(item);
          targetCtx.strokeRect(bbox.x - 4, bbox.y - 4, bbox.w + 8, bbox.h + 8);
          targetCtx.restore();
          // 8 个缩放手柄（屏幕约 8px，换算到 base 坐标；零尺寸轴方向隐藏）
          const hs = 8 / state.camera.zoom;
          const hOK = bbox.h >= hs * 1.2;
          const wOK = bbox.w >= hs * 1.2;
          let handles = [];
          if (wOK && hOK) {
            handles = [
              [bbox.x, bbox.y], [bbox.x + bbox.w / 2, bbox.y], [bbox.x + bbox.w, bbox.y],
              [bbox.x + bbox.w, bbox.y + bbox.h / 2], [bbox.x + bbox.w, bbox.y + bbox.h],
              [bbox.x + bbox.w / 2, bbox.y + bbox.h], [bbox.x, bbox.y + bbox.h], [bbox.x, bbox.y + bbox.h / 2]
            ];
          } else if (wOK) {
            handles = [[bbox.x, bbox.y + bbox.h / 2], [bbox.x + bbox.w, bbox.y + bbox.h / 2]];
          } else if (hOK) {
            handles = [[bbox.x + bbox.w / 2, bbox.y], [bbox.x + bbox.w / 2, bbox.y + bbox.h]];
          }
          targetCtx.save();
          targetCtx.setLineDash([]);
          targetCtx.fillStyle = '#ffffff';
          targetCtx.strokeStyle = '#2563eb';
          targetCtx.lineWidth = 1.5;
          handles.forEach(h => {
            targetCtx.fillRect(h[0] - hs, h[1] - hs, hs * 2, hs * 2);
            targetCtx.strokeRect(h[0] - hs, h[1] - hs, hs * 2, hs * 2);
          });
          targetCtx.restore();
        }

        targetCtx.restore();
      });

      targetCtx.restore();

      // 绘制过程中的操作提示（屏幕坐标，不随画布缩放）
      if (isWorkspace && state.currentDrawingItem) {
        targetCtx.save();
        targetCtx.font = '11px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace';
        targetCtx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        targetCtx.textBaseline = 'top';
        const hintText = state.currentDrawingItem.type === 'polygon'
          ? '继续点击加点 · 点回起点或双击闭合 · Esc 取消'
          : state.currentDrawingItem.type === 'curve'
            ? '继续点击加点 · 双击结束 · Esc 取消'
            : '点击下一点完成绘制 · Esc 取消';
        targetCtx.fillText(hintText, 14, 14);
        targetCtx.restore();
      }
    }

    // 计算图形外包矩形
    function getDrawItemBBox(item) {
      if (item.type === 'circle') {
        const r = Math.hypot(item.points[1].x - item.points[0].x, item.points[1].y - item.points[0].y);
        return { x: item.points[0].x - r, y: item.points[0].y - r, w: r * 2, h: r * 2 };
      }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      item.points.forEach(p => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      });
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    // 绘制文字并支持外描边、字重、等比缩放
    function drawTextAnnotations(targetCtx, isWorkspace = true) {
      if (!state.textItems.length) return;

      targetCtx.save();
      if (isWorkspace) {
        targetCtx.translate(state.camera.x, state.camera.y);
        targetCtx.scale(state.camera.zoom, state.camera.zoom);
      }

      state.textItems.forEach(item => {
        if (item.id === state.editingTextId) return;

        targetCtx.save();
        const fontName = item.font || state.textTypography.font;
        const fontWeight = item.weight || state.textTypography.weight;
        const fontItalic = item.italic ? 'italic' : 'normal';
        targetCtx.font = `${fontItalic} ${fontWeight} ${item.size}px ${fontName}`;
        targetCtx.textBaseline = 'top';

        // 实体外描边渲染 (支持独立自定义粗细)
        if (item.strokeEnabled) {
          targetCtx.strokeStyle = item.strokeColor || '#ffffff';
          targetCtx.lineWidth = (item.strokeWidth || 3);
          targetCtx.lineJoin = 'round';
          targetCtx.miterLimit = 2;
          targetCtx.strokeText(item.text, item.x, item.y);
        }

        // 文字主体填充
        targetCtx.fillStyle = item.color;
        targetCtx.fillText(item.text, item.x, item.y);

        // 选中文本状态的边框与四角手柄
        if (isWorkspace && state.selectedTextId === item.id) {
          const metrics = targetCtx.measureText(item.text);
          const tw = metrics.width;
          const th = item.size;

          targetCtx.strokeStyle = '#0f172a';
          targetCtx.lineWidth = 1;
          targetCtx.setLineDash([3, 3]);
          targetCtx.strokeRect(item.x - 3, item.y - 2, tw + 6, th + 4);

          targetCtx.setLineDash([]);
          targetCtx.fillStyle = '#ffffff';
          targetCtx.strokeStyle = '#0f172a';
          targetCtx.lineWidth = 1.2;

          const handles = [
            [item.x - 3, item.y - 2],
            [item.x + tw + 3, item.y - 2],
            [item.x - 3, item.y + th + 2],
            [item.x + tw + 3, item.y + th + 2]
          ];

          handles.forEach(([hx, hy]) => {
            targetCtx.fillRect(hx - TEXT_HANDLE_SIZE / 2, hy - TEXT_HANDLE_SIZE / 2, TEXT_HANDLE_SIZE, TEXT_HANDLE_SIZE);
            targetCtx.strokeRect(hx - TEXT_HANDLE_SIZE / 2, hy - TEXT_HANDLE_SIZE / 2, TEXT_HANDLE_SIZE, TEXT_HANDLE_SIZE);
          });
        }
        targetCtx.restore();
      });

      targetCtx.restore();
    }

    function redraw() {
      resizeCanvasToDisplay();
      const width = viewportWrap.clientWidth;
      const height = viewportWrap.clientHeight;
      ctx.clearRect(0, 0, width, height);

      if (!state.frames.length) return;

      const baseFrame = state.frames[0];
      const activeFrame = state.frames[state.activeFrameIndex];
      const isBaseSelected = (state.activeFrameIndex === 0);

      ctx.save();

      // 1. 裁剪框内部 100% 正常显示
      const cropScreenTL = baseToCanvasCoords(state.cropRect.x, state.cropRect.y);
      const cropScreenW = state.cropRect.w * state.camera.zoom;
      const cropScreenH = state.cropRect.h * state.camera.zoom;

      ctx.save();
      ctx.beginPath();
      ctx.rect(cropScreenTL.x, cropScreenTL.y, cropScreenW, cropScreenH);
      ctx.clip();

      ctx.fillStyle = state.bgColor;
      ctx.fillRect(cropScreenTL.x, cropScreenTL.y, cropScreenW, cropScreenH);

      if (state.isBlinking) {
        if (activeFrame && activeFrame.visible !== false) drawFrameWithTransform(ctx, activeFrame, 1.0, true);
      } else if (isBaseSelected || !state.onionSkinEnabled) {
        if (activeFrame && activeFrame.visible !== false) drawFrameWithTransform(ctx, activeFrame, 1.0, true);
      } else {
        if (baseFrame && baseFrame.visible !== false) drawFrameWithTransform(ctx, baseFrame, 1.0, true);
        if (activeFrame && activeFrame.visible !== false) drawFrameWithTransform(ctx, activeFrame, state.onionOpacity, true);
      }

      // 渲染矢量与文字
      drawVectorGraphics(ctx, true);
      drawTextAnnotations(ctx, true);
      ctx.restore();

      // 2. 裁切框外：淡显 80% (通过 0.8 遮罩与 0.2 底图实现精准 80% 淡显衰减)
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, width, height);
      ctx.rect(cropScreenTL.x + cropScreenW, cropScreenTL.y, -cropScreenW, cropScreenH);
      ctx.clip();

      ctx.fillStyle = 'rgba(241, 245, 249, 0.80)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalAlpha = 0.20;
      if (isBaseSelected || !state.onionSkinEnabled || state.isBlinking) {
        if (activeFrame && activeFrame.visible !== false) drawFrameWithTransform(ctx, activeFrame, 1.0, true);
      } else {
        if (baseFrame && baseFrame.visible !== false) drawFrameWithTransform(ctx, baseFrame, 1.0, true);
        if (activeFrame && activeFrame.visible !== false) drawFrameWithTransform(ctx, activeFrame, state.onionOpacity, true);
      }
      drawVectorGraphics(ctx, true);
      drawTextAnnotations(ctx, true);
      ctx.restore();

      // 3. 基准图边框
      if (baseFrame && baseFrame.visible !== false) {
        const baseTL = baseToCanvasCoords(0, 0);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.strokeRect(baseTL.x, baseTL.y, baseFrame.image.naturalWidth * state.camera.zoom, baseFrame.image.naturalHeight * state.camera.zoom);
      }

      // 4. 定点准心 (仅对齐模式可见)
      if (activeFrame && activeFrame.visible !== false && !state.isTextModeActive && !state.isDrawModeActive) {
        drawAnchorSystem(activeFrame);
      }

      // 5. 裁剪框与控制手柄
      drawCropFrame(cropScreenTL.x, cropScreenTL.y, cropScreenW, cropScreenH);

      ctx.restore();

      if (state.loupeEnabled && state.isMouseOverCanvas && !state.isTextModeActive && !state.isDrawModeActive) {
        renderMagnifierLoupe();
      }
    }

    function drawAnchorSystem(frame) {
      const isBase = (frame === state.frames[0]);
      const baseFrame = state.frames[0];

      if (isBase) {
        if (frame.anchorA) {
          const sA = baseToCanvasCoords(frame.anchorA.x, frame.anchorA.y);
          drawMinimalReticle(sA.x, sA.y, '#0f172a', `基准 A`, state.currentPickPoint === 'A');
        }
        if (frame.anchorB && frame.mode === '2point') {
          const sB = baseToCanvasCoords(frame.anchorB.x, frame.anchorB.y);
          drawMinimalReticle(sB.x, sB.y, '#475569', `基准 B`, state.currentPickPoint === 'B');
          if (frame.anchorA) {
            const sA = baseToCanvasCoords(frame.anchorA.x, frame.anchorA.y);
            drawFineLink(sA, sB);
          }
        }
      } else {
        const baseA = baseFrame?.anchorA;
        const baseB = baseFrame?.anchorB;

        if (baseA) {
          const sBaseA = baseToCanvasCoords(baseA.x, baseA.y);
          drawTargetHole(sBaseA.x, sBaseA.y, '#94a3b8');
        }

        if (frame.anchorA && baseA) {
          const sA = baseToCanvasCoords(baseA.x, baseA.y);
          drawMinimalReticle(sA.x, sA.y, '#0f172a', `点 A`, state.currentPickPoint === 'A');
        }

        if (frame.mode === '2point') {
          if (baseB) {
            const sBaseB = baseToCanvasCoords(baseB.x, baseB.y);
            drawTargetHole(sBaseB.x, sBaseB.y, '#94a3b8');
            if (frame.anchorB) {
              drawMinimalReticle(sBaseB.x, sBaseB.y, '#475569', `点 B`, state.currentPickPoint === 'B');
            }
          }
          if (baseA && baseB && frame.anchorA && frame.anchorB) {
            const sA = baseToCanvasCoords(baseA.x, baseA.y);
            const sB = baseToCanvasCoords(baseB.x, baseB.y);
            drawFineLink(sA, sB);
          }
        }
      }
    }

    function drawTargetHole(x, y, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.setLineDash([2, 2]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawFineLink(pt1, pt2) {
      ctx.save();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(pt1.x, pt1.y);
      ctx.lineTo(pt2.x, pt2.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawMinimalReticle(x, y, color, label, isSelected = false) {
      ctx.save();
      ctx.lineWidth = isSelected ? 1.5 : 1;
      ctx.strokeStyle = color;

      ctx.beginPath();
      ctx.arc(x, y, isSelected ? 8 : 6, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y);
      ctx.moveTo(x, y - 12); ctx.lineTo(x + 12, y);
      ctx.stroke();

      ctx.font = '9px monospace';
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'left';
      ctx.fillText(label, x + 10, y - 5);
      ctx.restore();
    }

    function drawCropFrame(x, y, w, h) {
      ctx.save();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, w, h);

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 0.75;
      ctx.beginPath();
      ctx.moveTo(x + w / 3, y); ctx.lineTo(x + w / 3, y + h);
      ctx.moveTo(x + (2 * w) / 3, y); ctx.lineTo(x + (2 * w) / 3, y + h);
      ctx.moveTo(x, y + h / 3); ctx.lineTo(x + w, y + h / 3);
      ctx.moveTo(x, y + (2 * h) / 3); ctx.lineTo(x + w, y + (2 * h) / 3);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;

      const handles = getScreenCropHandles(x, y, w, h);
      for (const key in handles) {
        const pt = handles[key];
        ctx.beginPath();
        ctx.rect(pt.x - HANDLE_SIZE / 2, pt.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function getScreenCropHandles(x, y, w, h) {
      return {
        tl: { x, y }, tr: { x: x + w, y },
        bl: { x, y: y + h }, br: { x: x + w, y: y + h },
        tc: { x: x + w / 2, y }, bc: { x: x + w / 2, y: y + h },
        ml: { x, y: y + h / 2 }, mr: { x: x + w, y: y + h / 2 }
      };
    }

    function renderMagnifierLoupe() {
      if (!state.frames.length || !state.loupeEnabled) {
        loupeContainer.classList.add('hidden');
        return;
      }
      const activeFrame = state.frames[state.activeFrameIndex];
      if (!activeFrame) return;

      loupeContainer.classList.remove('hidden');
      const size = 144;
      loupeCanvas.width = size;
      loupeCanvas.height = size;

      const basePos = state.mousePosBaseImage;
      loupeCoordBadge.textContent = `${Math.round(basePos.x)}, ${Math.round(basePos.y)}`;

      loupeCtx.imageSmoothingEnabled = false;
      loupeCtx.fillStyle = state.bgColor;
      loupeCtx.fillRect(0, 0, size, size);

      const zoom = state.loupeScale;
      loupeCtx.save();
      loupeCtx.translate(size / 2, size / 2);
      loupeCtx.scale(zoom, zoom);
      loupeCtx.translate(-basePos.x, -basePos.y);

      const baseFrame = state.frames[0];
      if (state.onionSkinEnabled && activeFrame !== baseFrame) {
        drawFrameWithTransform(loupeCtx, baseFrame, 1.0, false);
        drawFrameWithTransform(loupeCtx, activeFrame, state.onionOpacity, false);
      } else {
        drawFrameWithTransform(loupeCtx, activeFrame, 1.0, false);
      }
      drawVectorGraphics(loupeCtx, false);
      drawTextAnnotations(loupeCtx, false);
      loupeCtx.restore();

      if (zoom >= 8) {
        loupeCtx.save();
        loupeCtx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
        loupeCtx.lineWidth = 0.5;
        const offsetX = (size / 2 - (basePos.x % 1) * zoom) % zoom;
        const offsetY = (size / 2 - (basePos.y % 1) * zoom) % zoom;
        for (let gx = offsetX; gx < size; gx += zoom) {
          loupeCtx.beginPath(); loupeCtx.moveTo(gx, 0); loupeCtx.lineTo(gx, size); loupeCtx.stroke();
        }
        for (let gy = offsetY; gy < size; gy += zoom) {
          loupeCtx.beginPath(); loupeCtx.moveTo(0, gy); loupeCtx.lineTo(size, gy); loupeCtx.stroke();
        }
        loupeCtx.restore();
      }
    }

    function getTextItemAt(basePos) {
      for (let i = state.textItems.length - 1; i >= 0; i--) {
        const item = state.textItems[i];
        ctx.save();
        const fontName = item.font || state.textTypography.font;
        const fontWeight = item.weight || state.textTypography.weight;
        const fontItalic = item.italic ? 'italic' : 'normal';
        ctx.font = `${fontItalic} ${fontWeight} ${item.size}px ${fontName}`;
        const metrics = ctx.measureText(item.text);
        ctx.restore();

        const w = metrics.width;
        const h = item.size;
        if (basePos.x >= item.x - 6 && basePos.x <= item.x + w + 6 && basePos.y >= item.y - 6 && basePos.y <= item.y + h + 6) {
          return item;
        }
      }
      return null;
    }

    function getTextHandleAt(basePos, item) {
      if (!item) return null;
      ctx.save();
      const fontName = item.font || state.textTypography.font;
      const fontWeight = item.weight || state.textTypography.weight;
      const fontItalic = item.italic ? 'italic' : 'normal';
      ctx.font = `${fontItalic} ${fontWeight} ${item.size}px ${fontName}`;
      const metrics = ctx.measureText(item.text);
      ctx.restore();

      const tw = metrics.width;
      const th = item.size;
      const handles = {
        tl: { x: item.x - 3, y: item.y - 2 },
        tr: { x: item.x + tw + 3, y: item.y - 2 },
        bl: { x: item.x - 3, y: item.y + th + 2 },
        br: { x: item.x + tw + 3, y: item.y + th + 2 }
      };

      const hitDist = 9 / state.camera.zoom;
      for (const [key, pt] of Object.entries(handles)) {
        if (Math.hypot(basePos.x - pt.x, basePos.y - pt.y) <= hitDist) return key;
      }
      return null;
    }

    function getDrawItemAt(basePos) {
      for (let i = state.drawItems.length - 1; i >= 0; i--) {
        const item = state.drawItems[i];
        const bbox = getDrawItemBBox(item);
        if (basePos.x >= bbox.x - 8 && basePos.x <= bbox.x + bbox.w + 8 &&
            basePos.y >= bbox.y - 8 && basePos.y <= bbox.y + bbox.h + 8) {
          return item;
        }
      }
      return null;
    }

    // 命中选中图元缩放手柄（8 个方向，屏幕约 8px 热区；零尺寸轴方向的手柄隐藏）
    function getDrawHandleAt(basePos) {
      if (!state.selectedDrawId) return null;
      const item = state.drawItems.find(d => d.id === state.selectedDrawId);
      if (!item || !item.points || item.points.length < 2) return null;
      const bbox = getDrawItemBBox(item);
      if (bbox.w < 1 && bbox.h < 1) return null;
      const hs = 8 / state.camera.zoom;
      const hOK = bbox.h >= hs * 1.2;   // 高度足够才提供 t/b 手柄
      const wOK = bbox.w >= hs * 1.2;   // 宽度足够才提供 l/r 手柄
      const handles = [];
      if (wOK && hOK) {
        handles.push(
          ['tl', bbox.x, bbox.y],
          ['t', bbox.x + bbox.w / 2, bbox.y],
          ['tr', bbox.x + bbox.w, bbox.y],
          ['r', bbox.x + bbox.w, bbox.y + bbox.h / 2],
          ['br', bbox.x + bbox.w, bbox.y + bbox.h],
          ['b', bbox.x + bbox.w / 2, bbox.y + bbox.h],
          ['bl', bbox.x, bbox.y + bbox.h],
          ['l', bbox.x, bbox.y + bbox.h / 2]
        );
      } else if (wOK) {
        handles.push(['l', bbox.x, bbox.y + bbox.h / 2], ['r', bbox.x + bbox.w, bbox.y + bbox.h / 2]);
      } else if (hOK) {
        handles.push(['t', bbox.x + bbox.w / 2, bbox.y], ['b', bbox.x + bbox.w / 2, bbox.y + bbox.h]);
      }
      for (const [name, hx, hy] of handles) {
        if (Math.abs(basePos.x - hx) <= hs && Math.abs(basePos.y - hy) <= hs) return name;
      }
      return null;
    }

    function startDirectTextInput(basePos, existingItem = null) {
      const activeExisting = document.querySelector('.inline-editor-box');
      if (activeExisting) activeExisting.blur();

      const screenPos = baseToCanvasCoords(basePos.x, basePos.y);
      const input = document.createElement('div');
      input.contentEditable = 'true';
      input.className = 'inline-editor-box';
      input.style.left = `${screenPos.x}px`;
      input.style.top = `${screenPos.y}px`;

      const fontSize = existingItem ? existingItem.size : state.textTypography.size;
      const fontColor = existingItem ? existingItem.color : state.textTypography.color;
      const fontName = existingItem ? (existingItem.font || state.textTypography.font) : state.textTypography.font;
      const fontWeight = existingItem ? (existingItem.weight || state.textTypography.weight) : state.textTypography.weight;
      const fontItalic = existingItem ? !!existingItem.italic : state.textTypography.italic;

      input.style.fontSize = `${Math.max(12, fontSize * state.camera.zoom)}px`;
      input.style.color = fontColor;
      input.style.fontFamily = fontName;
      input.style.fontWeight = fontWeight;
      input.style.fontStyle = fontItalic ? 'italic' : 'normal';
      input.textContent = existingItem ? existingItem.text : '';

      viewportWrap.appendChild(input);

      if (existingItem) {
        state.editingTextId = existingItem.id;
      }
      redraw();

      setTimeout(() => {
        input.focus();
        if (existingItem) {
          const range = document.createRange();
          range.selectNodeContents(input);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }, 20);

      input.addEventListener('mousedown', (e) => e.stopPropagation());

      let isCommitted = false;
      function commit() {
        if (isCommitted) return;
        isCommitted = true;
        const val = input.textContent.trim();
        state.editingTextId = null;

        if (val) {
          if (existingItem) {
            existingItem.text = val;
            saveHistorySnapshot('编辑文字');
          } else {
            const newItem = {
              id: 'text_' + Date.now(),
              text: val,
              x: Math.round(basePos.x),
              y: Math.round(basePos.y),
              size: state.textTypography.size,
              color: state.textTypography.color,
              font: state.textTypography.font,
              weight: state.textTypography.weight,
              italic: state.textTypography.italic,
              strokeEnabled: state.textTypography.strokeEnabled,
              strokeColor: state.textTypography.strokeColor,
              strokeWidth: state.textTypography.strokeWidth
            };
            state.textItems.push(newItem);
            state.selectedTextId = newItem.id;
            saveHistorySnapshot('添加文字');
          }
        } else if (existingItem) {
          state.textItems = state.textItems.filter(t => t.id !== existingItem.id);
          state.selectedTextId = null;
          saveHistorySnapshot('删除文字');
        }
        input.remove();
        syncTextToolbarValues();
        redraw();
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          commit();
        } else if (e.key === 'Escape') {
          isCommitted = true;
          state.editingTextId = null;
          input.remove();
          redraw();
        }
      });
      input.addEventListener('blur', commit);
    }

    function initInteractions() {
      function getHitHandle(screenX, screenY) {
        const cropScreenTL = baseToCanvasCoords(state.cropRect.x, state.cropRect.y);
        const cropScreenW = state.cropRect.w * state.camera.zoom;
        const cropScreenH = state.cropRect.h * state.camera.zoom;
        const handles = getScreenCropHandles(cropScreenTL.x, cropScreenTL.y, cropScreenW, cropScreenH);
        const threshold = HANDLE_SIZE * 2;
        for (const [key, pt] of Object.entries(handles)) {
          if (Math.hypot(screenX - pt.x, screenY - pt.y) <= threshold) return key;
        }
        return null;
      }

      function isInsideCrop(basePos) {
        const { x, y, w, h } = state.cropRect;
        return basePos.x >= x && basePos.x <= x + w && basePos.y >= y && basePos.y <= y + h;
      }

      // Mac 触控板平移与捏合手势
      viewportWrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (!state.frames.length) return;

        const rect = mainCanvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (e.ctrlKey || e.metaKey) {
          const zoomFactor = Math.exp(-e.deltaY * 0.012);
          const newZoom = Math.min(12.0, Math.max(0.08, state.camera.zoom * zoomFactor));

          state.camera.x = mouseX - (mouseX - state.camera.x) * (newZoom / state.camera.zoom);
          state.camera.y = mouseY - (mouseY - state.camera.y) * (newZoom / state.camera.zoom);
          state.camera.zoom = newZoom;
        } else {
          state.camera.x -= e.deltaX;
          state.camera.y -= e.deltaY;
        }

        zoomPercentLabel.textContent = `${Math.round(state.camera.zoom * 100)}%`;
        redraw();
      }, { passive: false });

      viewportWrap.addEventListener('mousedown', (e) => {
        if (!state.frames.length) return;
        if (e.target.closest('#textRichCard') || e.target.closest('#drawingToolbarCard') || e.target.classList.contains('inline-editor-box')) return;

        const rect = mainCanvas.getBoundingClientRect();
        const screenX = e.clientX - rect.left;
        const screenY = e.clientY - rect.top;
        const basePos = clientToBaseCoords(e.clientX, e.clientY);

        if (state.isSpacePressed || e.button === 1) {
          state.isPanning = true;
          state.panStart = { x: e.clientX - state.camera.x, y: e.clientY - state.camera.y };
          viewportWrap.style.cursor = 'grabbing';
          return;
        }

        if (e.button === 0) {
          // 1. 文字模式交互
          if (state.isTextModeActive) {
            if (state.selectedTextId) {
              const curItem = state.textItems.find(t => t.id === state.selectedTextId);
              const textHandle = getTextHandleAt(basePos, curItem);
              if (textHandle) {
                state.isResizingText = true;
                state.activeTextHandle = textHandle;
                state.dragStart = basePos;
                state.initialTextState = { x: curItem.x, y: curItem.y, size: curItem.size };
                return;
              }
            }

            const hitText = getTextItemAt(basePos);
            if (hitText) {
              state.selectedTextId = hitText.id;
              state.isDraggingText = true;
              state.textDragOffset = { x: basePos.x - hitText.x, y: basePos.y - hitText.y };
              syncTextToolbarValues();
              redraw();
              return;
            } else {
              state.selectedTextId = null;
              syncTextToolbarValues();
              startDirectTextInput(basePos);
              return;
            }
          }

          // 2. 绘图模式交互（Rhino/CAD 点击式：先点起点，再点终点定稿）
          if (state.isDrawModeActive) {
            // 正在绘制中：处理后续点击
            if (state.currentDrawingItem) {
              const curType = state.currentDrawingItem.type;

              // polygon：点击回到起点则闭合成面，否则继续加点
              if (curType === 'polygon') {
                const firstPt = state.currentDrawingItem.points[0];
                if (Math.hypot(basePos.x - firstPt.x, basePos.y - firstPt.y) < 12 / state.camera.zoom) {
                  state.currentDrawingItem.closed = true;
                  state.drawItems.push(state.currentDrawingItem);
                  state.selectedDrawId = state.currentDrawingItem.id;
                  state.currentDrawingItem = null;
                  state.isDrawingNow = false;
                  saveHistorySnapshot('绘制闭合多段线');
                  redraw();
                  return;
                }
                state.currentDrawingItem.points.push({ x: Math.round(basePos.x), y: Math.round(basePos.y) });
                redraw();
                return;
              }

              // curve：每次点击加一个点，双击或 Esc 结束
              if (curType === 'curve') {
                state.currentDrawingItem.points.push({ x: Math.round(basePos.x), y: Math.round(basePos.y) });
                redraw();
                return;
              }

              // line / dashed / arrow / rect / circle：第二点点击定稿
              state.currentDrawingItem.points[1] = { x: Math.round(basePos.x), y: Math.round(basePos.y) };
              state.drawItems.push(state.currentDrawingItem);
              state.selectedDrawId = state.currentDrawingItem.id;
              state.currentDrawingItem = null;
              state.isDrawingNow = false;
              saveHistorySnapshot('绘制图元');
              redraw();
              return;
            }

            // 未在绘制中：优先命中选中对象缩放手柄（拖动选框角/边放大缩小，Shift 等比）
            const drawHandle = getDrawHandleAt(basePos);
            if (drawHandle && state.selectedDrawId) {
              const resizeItem = state.drawItems.find(d => d.id === state.selectedDrawId);
              if (resizeItem) {
                state.isResizingDraw = true;
                state.activeDrawHandle = drawHandle;
                state.resizeStartBBox = getDrawItemBBox(resizeItem);
                state.resizeStartPoints = resizeItem.points.map(p => ({ ...p }));
                redraw();
                return;
              }
            }

            // 未在绘制中：再命中已有图元进入拖动
            const hitDraw = getDrawItemAt(basePos);
            if (hitDraw && !e.shiftKey) {
              state.selectedDrawId = hitDraw.id;
              state.isDraggingDraw = true;
              const bbox = getDrawItemBBox(hitDraw);
              state.drawDragOffset = { x: basePos.x - bbox.x, y: basePos.y - bbox.y };
              syncDrawToolbarValues();
              redraw();
              return;
            }

            // 空白处点击：记录起点，进入两点式绘制
            state.isDrawingNow = true;
            state.selectedDrawId = null;
            state.currentDrawingItem = {
              id: 'draw_' + Date.now(),
              type: state.drawParams.shapeType,
              strokeWidth: state.drawParams.strokeWidth,
              strokeColor: state.drawParams.strokeColor,
              fillEnabled: state.drawParams.fillEnabled,
              fillColor: state.drawParams.fillColor,
              hasArrow: state.drawParams.hasArrow,
              points: [
                { x: Math.round(basePos.x), y: Math.round(basePos.y) },
                { x: Math.round(basePos.x), y: Math.round(basePos.y) }
              ]
            };
            redraw();
            return;
          }

          // 3. 通用选中图元或文字移动
          const hitText = getTextItemAt(basePos);
          if (hitText) {
            state.selectedTextId = hitText.id;
            state.isDraggingText = true;
            state.textDragOffset = { x: basePos.x - hitText.x, y: basePos.y - hitText.y };
            redraw();
            return;
          } else {
            state.selectedTextId = null;
          }

          const hitDraw = getDrawItemAt(basePos);
          if (hitDraw) {
            state.selectedDrawId = hitDraw.id;
            state.isDraggingDraw = true;
            const bbox = getDrawItemBBox(hitDraw);
            state.drawDragOffset = { x: basePos.x - bbox.x, y: basePos.y - bbox.y };
            redraw();
            return;
          } else {
            state.selectedDrawId = null;
          }

          const hitHandle = getHitHandle(screenX, screenY);
          if (hitHandle) {
            state.isResizingCrop = true;
            state.activeHandle = hitHandle;
            state.dragStart = basePos;
            state.initialCropRect = { ...state.cropRect };
            return;
          }

          if (e.altKey && isInsideCrop(basePos)) {
            state.isDraggingCrop = true;
            state.dragStart = basePos;
            state.initialCropRect = { ...state.cropRect };
            return;
          }

          // 4. 对齐模式落点
          applyPointCalibrationAt(basePos);
        }
      });

      viewportWrap.addEventListener('dblclick', (e) => {
        if (e.target.closest('#textRichCard') || e.target.closest('#drawingToolbarCard') || e.target.classList.contains('inline-editor-box')) return;
        const basePos = clientToBaseCoords(e.clientX, e.clientY);

        if (state.isDrawModeActive && state.currentDrawingItem) {
          if (state.currentDrawingItem.type === 'polygon') {
            if (state.currentDrawingItem.points.length >= 2) {
              // 双击结束为开放多段线（不闭合）；只有点回起点才闭合为面
              state.currentDrawingItem.closed = false;
              state.drawItems.push(state.currentDrawingItem);
              state.selectedDrawId = state.currentDrawingItem.id;
              state.currentDrawingItem = null;
              state.isDrawingNow = false;
              saveHistorySnapshot('绘制多段线');
              redraw();
              return;
            }
          } else if (state.currentDrawingItem.type === 'curve') {
            if (state.currentDrawingItem.points.length >= 2) {
              state.drawItems.push(state.currentDrawingItem);
              state.selectedDrawId = state.currentDrawingItem.id;
              state.currentDrawingItem = null;
              state.isDrawingNow = false;
              saveHistorySnapshot('绘制曲线');
              redraw();
              return;
            }
          }
        }

        const hitText = getTextItemAt(basePos);
        if (hitText) {
          state.selectedTextId = hitText.id;
          syncTextToolbarValues();
          startDirectTextInput({ x: hitText.x, y: hitText.y }, hitText);
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.frames.length) return;

        const rect = mainCanvas.getBoundingClientRect();
        const screenX = e.clientX - rect.left;
        const screenY = e.clientY - rect.top;
        const basePos = clientToBaseCoords(e.clientX, e.clientY);

        state.mousePosBaseImage = basePos;
        state.isMouseOverCanvas = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);

        if (state.loupeEnabled && state.isMouseOverCanvas && !state.isTextModeActive && !state.isDrawModeActive) {
          let lx = screenX + 16;
          let ly = screenY - 144 - 16;
          if (lx + 144 > viewportWrap.clientWidth) lx = screenX - 144 - 16;
          if (ly < 10) ly = screenY + 16;
          loupeContainer.style.left = `${lx}px`;
          loupeContainer.style.top = `${ly}px`;
        } else {
          loupeContainer.classList.add('hidden');
        }

        if (state.isPanning) {
          state.camera.x = e.clientX - state.panStart.x;
          state.camera.y = e.clientY - state.panStart.y;
          redraw();
          return;
        }

        if (state.isDrawingNow && state.currentDrawingItem) {
          const pts = state.currentDrawingItem.points;
          // 点击式绘制：仅实时预览最后一个点（polygon 不加点不预览）
          if (state.currentDrawingItem.type !== 'polygon') {
            pts[pts.length - 1] = { x: Math.round(basePos.x), y: Math.round(basePos.y) };
          }
          redraw();
          return;
        }

        // 拖动选框手柄缩放选中图元（Shift 等比）
        if (state.isResizingDraw && state.selectedDrawId && state.resizeStartBBox && state.resizeStartPoints) {
          const item = state.drawItems.find(d => d.id === state.selectedDrawId);
          if (item) {
            const ob = state.resizeStartBBox;
            const handle = state.activeDrawHandle;
            let nx = ob.x, ny = ob.y, nx2 = ob.x + ob.w, ny2 = ob.y + ob.h;

            if (handle.includes('l')) nx = Math.min(basePos.x, nx2 - 1);
            if (handle.includes('r')) nx2 = Math.max(basePos.x, nx + 1);
            if (handle.includes('t')) ny = Math.min(basePos.y, ny2 - 1);
            if (handle.includes('b')) ny2 = Math.max(basePos.y, ny + 1);

            // Shift 等比：仅角手柄支持，以对角为固定点
            if (e.shiftKey && ob.w > 0 && ob.h > 0 && ['tl', 'tr', 'br', 'bl'].includes(handle)) {
              const fx = (handle === 'tr' || handle === 'br') ? ob.x : ob.x + ob.w;
              const fy = (handle === 'bl' || handle === 'br') ? ob.y : ob.y + ob.h;
              const ratio = ob.w / ob.h;
              let nw = Math.abs(basePos.x - fx);
              let nh = Math.abs(basePos.y - fy);
              if (nw / ob.w >= nh / ob.h) {
                nh = nw / ratio;
              } else {
                nw = nh * ratio;
              }
              nw = Math.max(nw, 1); nh = Math.max(nh, 1);
              nx = (fx === ob.x) ? fx : fx - nw;
              nx2 = (fx === ob.x) ? fx + nw : fx;
              ny = (fy === ob.y) ? fy : fy - nh;
              ny2 = (fy === ob.y) ? fy + nh : fy;
            }

            if (nx2 <= nx) nx2 = nx + 1;
            if (ny2 <= ny) ny2 = ny + 1;
            const newW = nx2 - nx;
            const newH = ny2 - ny;

            // 线性映射所有点
            item.points = state.resizeStartPoints.map(src => ({
              x: Math.round(nx + (src.x - ob.x) * (newW / ob.w)),
              y: Math.round(ny + (src.y - ob.y) * (newH / ob.h))
            }));

            // 圆形保持正圆：圆心随框移动，半径取短边一半
            if (item.type === 'circle') {
              const cc = { x: nx + newW / 2, y: ny + newH / 2 };
              const r = Math.min(newW, newH) / 2;
              item.points = [
                { x: Math.round(cc.x), y: Math.round(cc.y) },
                { x: Math.round(cc.x + r), y: Math.round(cc.y) }
              ];
            }
            redraw();
          }
          return;
        }

        if (state.isDraggingDraw && state.selectedDrawId) {
          const item = state.drawItems.find(d => d.id === state.selectedDrawId);
          if (item) {
            const bbox = getDrawItemBBox(item);
            const dx = Math.round(basePos.x - state.drawDragOffset.x - bbox.x);
            const dy = Math.round(basePos.y - state.drawDragOffset.y - bbox.y);
            item.points.forEach(p => { p.x += dx; p.y += dy; });
            redraw();
          }
          return;
        }

        if (state.isResizingText && state.selectedTextId) {
          const textItem = state.textItems.find(t => t.id === state.selectedTextId);
          if (textItem && state.initialTextState) {
            const dy = basePos.y - state.dragStart.y;
            const factor = (state.activeTextHandle === 'tl' || state.activeTextHandle === 'tr') ? -dy : dy;
            const newSize = Math.max(10, Math.min(240, Math.round(state.initialTextState.size + factor * 0.8)));
            textItem.size = newSize;
            fontSizeInput.value = newSize;
            redraw();
          }
          return;
        }

        if (state.isDraggingText && state.selectedTextId) {
          const textItem = state.textItems.find(t => t.id === state.selectedTextId);
          if (textItem) {
            textItem.x = Math.round(basePos.x - state.textDragOffset.x);
            textItem.y = Math.round(basePos.y - state.textDragOffset.y);
            redraw();
          }
          return;
        }

        if (state.isResizingCrop) {
          const dx = basePos.x - state.dragStart.x;
          const dy = basePos.y - state.dragStart.y;
          const init = state.initialCropRect;
          let newRect = { ...init };

          switch (state.activeHandle) {
            case 'br': newRect.w = Math.max(20, init.w + dx); newRect.h = Math.max(20, init.h + dy); break;
            case 'tl':
              newRect.x = Math.min(init.x + init.w - 20, init.x + dx);
              newRect.y = Math.min(init.y + init.h - 20, init.y + dy);
              newRect.w = init.w - (newRect.x - init.x);
              newRect.h = init.h - (newRect.y - init.y);
              break;
            case 'tr':
              newRect.y = Math.min(init.y + init.h - 20, init.y + dy);
              newRect.w = Math.max(20, init.w + dx);
              newRect.h = init.h - (newRect.y - init.y);
              break;
            case 'bl':
              newRect.x = Math.min(init.x + init.w - 20, init.x + dx);
              newRect.w = init.w - (newRect.x - init.x);
              newRect.h = Math.max(20, init.h + dy);
              break;
            case 'mr': newRect.w = Math.max(20, init.w + dx); break;
            case 'ml':
              newRect.x = Math.min(init.x + init.w - 20, init.x + dx);
              newRect.w = init.w - (newRect.x - init.x);
              break;
            case 'bc': newRect.h = Math.max(20, init.h + dy); break;
            case 'tc':
              newRect.y = Math.min(init.y + init.h - 20, init.y + dy);
              newRect.h = init.h - (newRect.y - init.y);
              break;
          }

          applyAspectRatioConstraint(newRect);
          state.cropRect = newRect;
          updateCoordLabels();
          redraw();
          return;
        }

        if (state.isDraggingCrop) {
          const dx = basePos.x - state.dragStart.x;
          const dy = basePos.y - state.dragStart.y;
          state.cropRect.x = Math.round(state.initialCropRect.x + dx);
          state.cropRect.y = Math.round(state.initialCropRect.y + dy);
          updateCoordLabels();
          redraw();
          return;
        }

        if (state.isSpacePressed) {
          viewportWrap.style.cursor = 'grab';
        } else {
          if (state.selectedTextId) {
            const curItem = state.textItems.find(t => t.id === state.selectedTextId);
            const textHandle = getTextHandleAt(basePos, curItem);
            if (textHandle) {
              viewportWrap.style.cursor = (textHandle === 'tl' || textHandle === 'br') ? 'nwse-resize' : 'nesw-resize';
              return;
            }
          }

          const hitText = getTextItemAt(basePos);
          const hitDraw = getDrawItemAt(basePos);
          if (hitText || hitDraw) {
            viewportWrap.style.cursor = 'move';
            return;
          }
          const hitHandle = getHitHandle(screenX, screenY);
          if (hitHandle) {
            const cursors = {
              tl: 'nwse-resize', br: 'nwse-resize',
              tr: 'nesw-resize', bl: 'nesw-resize',
              tc: 'ns-resize', bc: 'ns-resize',
              ml: 'ew-resize', mr: 'ew-resize'
            };
            viewportWrap.style.cursor = cursors[hitHandle];
          } else if (e.altKey && isInsideCrop(basePos)) {
            viewportWrap.style.cursor = 'move';
          } else {
            viewportWrap.style.cursor = state.isTextModeActive ? 'text' : 'crosshair';
          }
        }

        redraw();
      });

      window.addEventListener('mouseup', () => {
        // 点击式绘制：图元已在第二次点击时提交，此处不再提交
        if (state.isResizingDraw) {
          state.isResizingDraw = false;
          state.activeDrawHandle = null;
          state.resizeStartBBox = null;
          state.resizeStartPoints = null;
          saveHistorySnapshot('缩放图元');
        }
        if (state.isDraggingDraw) {
          state.isDraggingDraw = false;
          saveHistorySnapshot('移动图元');
        }
        if (state.isResizingText) {
          state.isResizingText = false;
          saveHistorySnapshot('缩放文字大小');
        }
        if (state.isDraggingText) {
          state.isDraggingText = false;
          saveHistorySnapshot('移动文字');
        }
        if (state.isResizingCrop || state.isDraggingCrop) saveHistorySnapshot('调整裁剪框');
        state.isPanning = false;
        state.isResizingCrop = false;
        state.isDraggingCrop = false;
        state.activeHandle = null;
        viewportWrap.style.cursor = state.isSpacePressed ? 'grab' : (state.isTextModeActive ? 'text' : 'crosshair');
      });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.classList.contains('inline-editor-box')) return;

        if (e.code === 'Space' && !e.repeat) {
          e.preventDefault();
          state.isSpacePressed = true;
          viewportWrap.style.cursor = 'grab';
          state.isBlinking = true;
          redraw();
          return;
        }

        if (e.key === 'Escape') {
          if (state.currentDrawingItem) {
            state.currentDrawingItem = null;
            state.isDrawingNow = false;
            redraw();
            showToast('已取消当前绘制');
            return;
          }
        }

        if (e.key === 'Backspace' || e.key === 'Delete') {
          if (state.selectedTextId) {
            state.textItems = state.textItems.filter(t => t.id !== state.selectedTextId);
            state.selectedTextId = null;
            syncTextToolbarValues();
            saveHistorySnapshot('删除文字');
            redraw();
            showToast('已删除选中的文字');
            return;
          }
          if (state.selectedDrawId) {
            state.drawItems = state.drawItems.filter(d => d.id !== state.selectedDrawId);
            state.selectedDrawId = null;
            syncDrawToolbarValues();
            saveHistorySnapshot('删除图元');
            redraw();
            showToast('已删除选中的图形');
            return;
          }
        }

        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          if (!state.frames.length || state.isTextModeActive || state.isDrawModeActive) return;
          e.preventDefault();
          const activeFrame = state.frames[state.activeFrameIndex];
          if (!activeFrame) return;

          const targetPoint = (activeFrame.mode === '2point' && state.currentPickPoint === 'B') ? activeFrame.anchorB : activeFrame.anchorA;
          if (!targetPoint) return;

          const step = e.shiftKey ? 10 : 1;
          if (e.key === 'ArrowLeft') targetPoint.x -= step;
          if (e.key === 'ArrowRight') targetPoint.x += step;
          if (e.key === 'ArrowUp') targetPoint.y -= step;
          if (e.key === 'ArrowDown') targetPoint.y += step;

          recomputeFrameTransform(activeFrame);
          saveHistorySnapshot('微调定点');
          syncSidebarLayerModeUI();
          renderFrameList();
          redraw();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          state.isSpacePressed = false;
          state.isBlinking = false;
          viewportWrap.style.cursor = state.isTextModeActive ? 'text' : 'crosshair';
          redraw();
        }
      });
    }

    function applyPointCalibrationAt(basePos) {
      const activeFrame = state.frames[state.activeFrameIndex];
      const baseFrame = state.frames[0];
      if (!activeFrame) return;

      const isBase = (state.activeFrameIndex === 0);
      const isTargetA = (state.currentPickPoint === 'A' || activeFrame.mode === '1point');

      if (isBase) {
        const rawX = Math.round(basePos.x);
        const rawY = Math.round(basePos.y);
        if (isTargetA) {
          activeFrame.anchorA = { x: rawX, y: rawY };
          activeFrame.mode = '2point';
          state.currentPickPoint = 'B';
          showToast('已标定基准 A，已自动切换至两点模式，请标定基准 B');
        } else {
          activeFrame.anchorB = { x: rawX, y: rawY };
          showToast('已标定基准 B');
        }
      } else {
        const rawPos = baseToRawImageCoords(basePos, activeFrame);
        const rawX = Math.round(rawPos.x);
        const rawY = Math.round(rawPos.y);

        if (isTargetA) {
          activeFrame.anchorA = { x: rawX, y: rawY };
          activeFrame.mode = '2point';
          state.currentPickPoint = 'B';
          showToast('已标定点 A，已自动跳入两点对齐，请落第二点 B');
        } else {
          if (!baseFrame || !baseFrame.anchorB) {
            showToast('请先在图 1 标定基准点 B');
            return;
          }
          activeFrame.anchorB = { x: rawX, y: rawY };
          showToast('已标定点 B · 两点对齐完成');
        }
      }

      state.frames.forEach(f => recomputeFrameTransform(f));
      saveHistorySnapshot('标定锚点');
      syncSidebarLayerModeUI();
      renderFrameList();
      redraw();
    }

    function applyAspectRatioConstraint(rect) {
      if (state.cropRatio === 'free') return;
      let ratio = 1;
      if (state.cropRatio === '16:9') ratio = 16 / 9;
      else if (state.cropRatio === '4:3') ratio = 4 / 3;
      else if (state.cropRatio === '1:1') ratio = 1;
      else if (state.cropRatio === 'match1' && state.frames[0]) {
        ratio = state.frames[0].image.naturalWidth / state.frames[0].image.naturalHeight;
      }
      rect.h = Math.round(rect.w / ratio);
    }

    function renderCroppedFrameToCanvas(frame) {
      const outputCanvas = document.createElement('canvas');
      const w = Math.max(1, Math.round(state.cropRect.w));
      const h = Math.max(1, Math.round(state.cropRect.h));
      outputCanvas.width = w;
      outputCanvas.height = h;

      const outCtx = outputCanvas.getContext('2d');
      outCtx.fillStyle = state.bgColor;
      outCtx.fillRect(0, 0, w, h);

      outCtx.save();
      outCtx.translate(-state.cropRect.x, -state.cropRect.y);
      if (frame && frame.visible !== false) {
        drawFrameWithTransform(outCtx, frame, 1.0, false);
      }
      drawVectorGraphics(outCtx, false);
      drawTextAnnotations(outCtx, false);
      outCtx.restore();

      return outputCanvas;
    }

    const gifModal = document.getElementById('gifModal');
    const gifPreviewCanvas = document.getElementById('gifPreviewCanvas');
    const gifPreviewCtx = gifPreviewCanvas.getContext('2d');
    const gifRenderedResult = document.getElementById('gifRenderedResult');
    const gifEncodingSpinner = document.getElementById('gifEncodingSpinner');
    const btnCloseGifModal = document.getElementById('btnCloseGifModal');
    const btnCancelGif = document.getElementById('btnCancelGif');
    const btnGenerateAndDownloadGif = document.getElementById('btnGenerateAndDownloadGif');
    
    const modalSpeedSecInput = document.getElementById('modalSpeedSecInput');
    const modalSpeedSlider = document.getElementById('modalSpeedSlider');
    const modalSpeedFpsLabel = document.getElementById('modalSpeedFpsLabel');
    const modalCurFrameIndicator = document.getElementById('modalCurFrameIndicator');

    let cachedFrameCanvases = [];

    function setSpeedInSeconds(sec, source = 'none') {
      const validSec = Math.max(0.05, Math.min(5.0, parseFloat(sec) || 0.5));
      state.gifIntervalSec = Math.round(validSec * 100) / 100;

      if (source !== 'input') {
        modalSpeedSecInput.value = state.gifIntervalSec.toFixed(2);
      }
      if (source !== 'slider') {
        modalSpeedSlider.value = Math.min(2.0, Math.max(0.05, state.gifIntervalSec));
      }

      const fps = (1 / state.gifIntervalSec).toFixed(1);
      modalSpeedFpsLabel.textContent = `${fps} FPS`;

      updateSpeedPresetButtons(state.gifIntervalSec);

      if (state.gifPreviewTimer) {
        clearTimeout(state.gifPreviewTimer);
        runGifTick();
      }
    }

    function runGifTick() {
      if (!cachedFrameCanvases.length) return;
      const w = Math.round(state.cropRect.w);
      const h = Math.round(state.cropRect.h);

      const currentCanvas = cachedFrameCanvases[state.gifPreviewCurrentFrameIndex];
      gifPreviewCtx.clearRect(0, 0, w, h);
      gifPreviewCtx.drawImage(currentCanvas, 0, 0);

      modalCurFrameIndicator.textContent = `帧: ${state.gifPreviewCurrentFrameIndex + 1} / ${cachedFrameCanvases.length}`;

      state.gifPreviewCurrentFrameIndex = (state.gifPreviewCurrentFrameIndex + 1) % cachedFrameCanvases.length;
      state.gifPreviewTimer = setTimeout(runGifTick, state.gifIntervalSec * 1000);
    }

    function startGifLivePreview() {
      stopGifLivePreview();
      const visibleFrames = state.frames.filter(f => f.visible !== false);
      cachedFrameCanvases = visibleFrames.map(f => renderCroppedFrameToCanvas(f));

      const w = Math.round(state.cropRect.w);
      const h = Math.round(state.cropRect.h);
      gifPreviewCanvas.width = w;
      gifPreviewCanvas.height = h;

      gifPreviewCanvas.classList.remove('hidden');
      gifRenderedResult.classList.add('hidden');
      gifEncodingSpinner.classList.add('hidden');

      state.gifPreviewCurrentFrameIndex = 0;
      runGifTick();
    }

    function stopGifLivePreview() {
      if (state.gifPreviewTimer) {
        clearTimeout(state.gifPreviewTimer);
        state.gifPreviewTimer = null;
      }
    }

    document.getElementById('btnOpenGifStudio').addEventListener('click', () => {
      const visibleCount = state.frames.filter(f => f.visible !== false).length;
      if (visibleCount < 2) {
        showToast('生成动效至少需要 2 个可见图层');
        return;
      }
      setSpeedInSeconds(state.gifIntervalSec);
      gifModal.classList.remove('hidden');
      startGifLivePreview();
    });

    function closeGifModal() {
      stopGifLivePreview();
      gifModal.classList.add('hidden');
    }

    btnCloseGifModal.addEventListener('click', closeGifModal);
    btnCancelGif.addEventListener('click', closeGifModal);

    modalSpeedSecInput.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (!isNaN(val) && val > 0) setSpeedInSeconds(val, 'input');
    });

    modalSpeedSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      setSpeedInSeconds(val, 'slider');
    });

    document.querySelectorAll('.speed-preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const sec = parseFloat(e.target.dataset.sec);
        setSpeedInSeconds(sec, 'preset');
      });
    });

    function updateSpeedPresetButtons(activeSec) {
      document.querySelectorAll('.speed-preset-btn').forEach(b => {
        const presetVal = parseFloat(b.dataset.sec);
        if (Math.abs(presetVal - activeSec) < 0.01) {
          b.className = 'speed-preset-btn px-1.5 py-0.5 rounded bg-ink-900 text-white font-mono';
        } else {
          b.className = 'speed-preset-btn px-1.5 py-0.5 rounded border border-ink-200 bg-ink-50 hover:bg-ink-100 text-ink-700 font-mono';
        }
      });
    }

    btnGenerateAndDownloadGif.addEventListener('click', () => {
      const visibleFrames = state.frames.filter(f => f.visible !== false);
      if (!visibleFrames.length) return;
      gifEncodingSpinner.classList.remove('hidden');

      const frameDataUrls = cachedFrameCanvases.map(c => c.toDataURL('image/png'));
      const targetW = Math.round(state.cropRect.w);
      const targetH = Math.round(state.cropRect.h);

      gifshot.createGIF({
        images: frameDataUrls,
        gifWidth: targetW,
        gifHeight: targetH,
        interval: state.gifIntervalSec,
        numWorkers: 2
      }, function(obj) {
        gifEncodingSpinner.classList.add('hidden');
        if (!obj.error) {
          const link = document.createElement('a');
          link.href = obj.image;
          link.download = `${getTodayString()}-${state.projectName}-${state.gifIntervalSec}s.gif`;
          link.click();
          showToast('GIF 已成功导出');
        } else {
          showToast('生成 GIF 失败，请缩减画幅重试');
        }
      });
    });

    window.addEventListener('resize', redraw);

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateNamingPreview();
      initIngestion();
      initInteractions();
      initToolbar();
      saveHistorySnapshot('启动');
    });
  </script>
</body>
</html>
