<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对齐与画幅工坊 · Minimal Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            ink: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              500: '#64748b',
              400: '#94a3b8',
              300: '#cbd5e1',
              200: '#e2e8f0',
              100: '#f1f5f9',
              50: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Gifshot -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

  <style>
    html, body {
      height: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .canvas-bg-pattern {
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }

    #loupeContainer {
      pointer-events: none;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.15);
      image-rendering: pixelated;
    }

    input[type=range] {
      accent-color: #0f172a;
    }

    .btn-minimal {
      transition: all 0.12s ease-in-out;
    }
    .btn-minimal:active {
      transform: scale(0.98);
    }

    .inline-editor-box {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      outline: none;
      border: 1px dashed #0f172a;
      padding: 2px 6px;
      margin: 0;
      white-space: nowrap;
      line-height: 1.1;
      z-index: 60;
      caret-color: #0f172a;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
      border-radius: 2px;
      min-width: 60px;
    }
  </style>
</head>
<body class="bg-ink-50 text-ink-900 h-screen w-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- Minimal Header -->
  <header class="h-11 bg-white border-b border-ink-200 px-3.5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-ink-900 inline-block shrink-0"></span>
      
      <!-- Editable Project Title -->
      <div class="flex items-center gap-1 group">
        <input type="text" id="projectTitleInput" value="逻辑生成" placeholder="项目名称" 
               class="font-semibold text-xs text-ink-900 bg-transparent hover:bg-ink-50 focus:bg-white focus:border-ink-400 px-1.5 py-0.5 rounded border border-transparent outline-none w-28 sm:w-44 transition text-ellipsis"
               title="点击编辑项目名称，导出文件将以此命名">
        <i data-lucide="edit-3" class="w-3 h-3 text-ink-300 group-hover:text-ink-500 pointer-events-none"></i>
      </div>

      <div class="h-3.5 w-px bg-ink-200 mx-1"></div>

      <!-- Undo / Redo -->
      <div class="flex items-center gap-0.5">
        <button id="btnUndo" disabled title="撤销 (Ctrl+Z)" class="btn-minimal p-1 rounded hover:bg-ink-100 text-ink-500 hover:text-ink-900 disabled:opacity-25 transition">
          <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnRedo" disabled title="重做 (Ctrl+Y)" class="btn-minimal p-1 rounded hover:bg-ink-100 text-ink-500 hover:text-ink-900 disabled:opacity-25 transition">
          <i data-lucide="redo-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Ingestion Actions -->
    <div class="flex items-center gap-1.5">
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
      <button id="btnUpload" class="btn-minimal inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white hover:bg-ink-50 border border-ink-200 text-xs font-medium text-ink-700">
        <i data-lucide="upload" class="w-3 h-3 text-ink-500"></i> 上传
      </button>
      <button id="btnClearAll" class="btn-minimal inline-flex items-center gap-1 px-2 py-1 rounded hover:bg-rose-50 text-xs text-ink-400 hover:text-rose-600 transition" title="清空全部">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <div class="flex-1 min-h-0 flex overflow-hidden relative">

    <!-- Left Minimal Sidebar -->
    <aside class="w-64 sm:w-72 bg-white border-r border-ink-200 flex flex-col shrink-0 z-20 overflow-hidden">
      <div class="h-9 px-3 border-b border-ink-100 flex items-center justify-between text-xs text-ink-500">
        <span class="font-medium text-ink-800">图层栈 (<span id="frameCount">0</span>)</span>
        <span class="text-[10px] text-ink-400 font-mono">图1为基准</span>
      </div>

      <!-- Mode & Target Switch -->
      <div id="layerConfigPanel" class="p-3 border-b border-ink-100 text-xs flex flex-col gap-2 bg-ink-50/60">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-ink-900 truncate max-w-[120px]" id="currentEditingLayerName">未选择图层</span>
          <div class="flex items-center gap-1">
            <button id="btnResetAnchor" class="text-[10px] text-rose-600 hover:underline" title="一键重置当前图层的标定角点">
              重置标定
            </button>
            <span class="text-ink-300">·</span>
            <span id="badgeCurrentRole" class="text-[10px] px-1.5 py-0.5 rounded bg-white border border-ink-200 text-ink-600 font-mono">基准</span>
          </div>
        </div>

        <!-- 1-Point / 2-Point Mode Selector -->
        <div class="grid grid-cols-2 p-0.5 rounded bg-ink-200/70 border border-ink-200 text-[11px]">
          <button id="btnMode1Point" class="py-1 rounded font-medium text-center transition bg-white text-ink-900 shadow-sm">单点平移</button>
          <button id="btnMode2Point" class="py-1 rounded font-medium text-center transition text-ink-600 hover:text-ink-900">两点缩放</button>
        </div>

        <!-- Target Point Selector (A or B) -->
        <div class="flex items-center justify-between pt-0.5">
          <span class="text-[11px] text-ink-500">当前定点:</span>
          <div class="inline-flex rounded border border-ink-200 p-0.5 bg-white text-[10px]">
            <button id="btnPickPointA" class="px-2 py-0.5 rounded font-mono font-medium bg-ink-900 text-white">点 A</button>
            <button id="btnPickPointB" class="px-2 py-0.5 rounded font-mono font-medium text-ink-500 hover:text-ink-900">点 B</button>
          </div>
        </div>

        <!-- 2-Point Options Subpanel -->
        <div id="panel2PointOptions" class="hidden flex flex-col gap-1.5 pt-1 text-[11px] border-t border-ink-200/60">
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-ink-600">
            <input type="checkbox" id="checkAllowRotation" class="w-3.5 h-3.5 rounded border-ink-300 text-ink-900 focus:ring-0">
            <span>允许偏角旋转校正</span>
          </label>
          <div class="flex justify-between items-center text-[10px] text-ink-500 font-mono bg-white px-2 py-1 rounded border border-ink-200">
            <span>几何变换</span>
            <span id="labelTransformInfo" class="text-ink-900 font-semibold">100.0% / 0.0°</span>
          </div>
        </div>

        <!-- CV Auto Refinement Button -->
        <button id="btnAutoRefineCV" class="w-full py-1 text-[11px] bg-white hover:bg-ink-100 border border-ink-200 rounded font-medium text-ink-700 flex items-center justify-center gap-1.5 transition shadow-sm mt-0.5" title="以基准图局部特征自动滑窗消除 1~3px 细微重影">
          <i data-lucide="crosshair" class="w-3 h-3 text-ink-600"></i>
          <span>自动精细对齐 (消除微小重影)</span>
        </button>

        <div id="baseMissingPointBWarning" class="hidden p-2 rounded bg-amber-50 border border-amber-200 text-[11px] text-amber-800 flex flex-col gap-1">
          <span>图 1 尚未标定【基准点 B】</span>
          <button id="btnGoSetBasePointB" class="underline text-left font-medium text-amber-900 hover:text-black">
            前往图 1 标定点 B &rarr;
          </button>
        </div>
      </div>

      <!-- Frame Cards List with Visibility Toggles -->
      <div id="frameList" class="flex-1 overflow-y-auto p-2 space-y-1.5 min-h-0"></div>

      <!-- Empty State Notice -->
      <div id="sidebarEmptyNotice" class="p-6 text-center text-xs text-ink-400 my-auto flex flex-col items-center gap-2">
        <i data-lucide="image" class="w-6 h-6 stroke-1 text-ink-300"></i>
        <span>按 Ctrl+V 粘贴截图<br>或拖拽图片入内</span>
      </div>

      <!-- Alignment Status Footnote -->
      <div class="p-2.5 bg-white border-t border-ink-100 text-[11px] text-ink-500 flex items-center justify-between shrink-0">
        <span>对齐完成</span>
        <span id="alignProgress" class="font-mono text-ink-900 font-semibold">0 / 0</span>
      </div>
    </aside>

    <main class="flex-1 min-h-0 flex flex-col bg-ink-50 overflow-hidden relative" id="canvasContainer">
      
      <!-- Top Secondary Hairline Toolbar -->
      <div class="h-9 bg-white border-b border-ink-200 px-3.5 flex items-center justify-between text-xs text-ink-600 z-10 shrink-0">
        
        <!-- Left Tools: Onion Skin & Blink & Magnifier & Text & Drawing -->
        <div class="flex items-center gap-2.5">
          <label class="inline-flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="onionSkinToggle" class="w-3.5 h-3.5 rounded border-ink-300 text-ink-900 focus:ring-0" checked>
            <span class="text-[11px] font-medium text-ink-700">洋葱皮</span>
          </label>

          <div class="flex items-center gap-1">
            <input type="range" id="onionOpacity" min="0.05" max="0.95" step="0.05" value="0.5" class="w-14 h-1 bg-ink-200 rounded cursor-pointer">
            <span id="opacityVal" class="text-[10px] font-mono text-ink-500 w-6">50%</span>
          </div>

          <div class="h-3 w-px bg-ink-200"></div>

          <button id="btnBlink" class="btn-minimal px-2 py-0.5 rounded border border-ink-200 bg-white hover:bg-ink-50 text-[11px] text-ink-700 active:bg-ink-900 active:text-white transition">
            空格对比
          </button>

          <div class="h-3 w-px bg-ink-200"></div>

          <label class="inline-flex items-center gap-1 cursor-pointer">
            <input type="checkbox" id="loupeToggle" class="w-3.5 h-3.5 rounded border-ink-300 text-ink-900 focus:ring-0" checked>
            <span class="text-[11px] text-ink-700">放大镜</span>
          </label>
          <select id="loupeScaleSelect" class="bg-white border border-ink-200 text-ink-700 rounded px-1 py-0.5 text-[10px] outline-none">
            <option value="4">4x</option>
            <option value="6" selected>6x</option>
            <option value="8">8x 像素网格</option>
          </select>

          <div class="h-3 w-px bg-ink-200"></div>

          <button id="btnToggleTextMode" class="btn-minimal inline-flex items-center gap-1 px-2 py-0.5 rounded border border-ink-200 bg-white hover:bg-ink-50 text-[11px] text-ink-700" title="在画布上直接点击落字，上方弹出富文本排版">
            <i data-lucide="type" class="w-3 h-3 text-ink-500"></i> 文字
          </button>

          <button id="btnToggleDrawMode" class="btn-minimal inline-flex items-center gap-1 px-2 py-0.5 rounded border border-ink-200 bg-white hover:bg-ink-50 text-[11px] text-ink-700" title="在线条与面域之间自由绘制标注">
            <i data-lucide="pen-tool" class="w-3 h-3 text-ink-500"></i> 绘图
          </button>
        </div>

        <!-- Right Tools -->
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1 border border-ink-200 rounded p-0.5 bg-white">
            <button id="btnToggleBW" class="btn-minimal px-1.5 py-0.5 rounded text-[10px] font-mono hover:bg-ink-100 text-ink-800" title="在纯白与纯黑之间快速切换">
              白/黑
            </button>
            <div class="relative w-4 h-4 rounded overflow-hidden border border-ink-300 flex items-center justify-center cursor-pointer" title="自选调色板底色">
              <input type="color" id="bgColorPicker" value="#ffffff" class="absolute -inset-2 w-8 h-8 opacity-0 cursor-pointer">
              <div id="bgColorSwatchPreview" class="w-full h-full bg-white"></div>
            </div>
          </div>

          <div class="h-3 w-px bg-ink-200 hidden sm:block"></div>

          <div class="hidden sm:flex items-center gap-1 text-[11px]">
            <button class="crop-ratio-btn px-1.5 py-0.5 rounded text-[10px] bg-ink-900 text-white font-mono" data-ratio="free">自由</button>
            <button class="crop-ratio-btn px-1.5 py-0.5 rounded text-[10px] bg-white border border-ink-200 text-ink-600 hover:bg-ink-50 font-mono" data-ratio="16:9">16:9</button>
            <button class="crop-ratio-btn px-1.5 py-0.5 rounded text-[10px] bg-white border border-ink-200 text-ink-600 hover:bg-ink-50 font-mono" data-ratio="4:3">4:3</button>
            <button class="crop-ratio-btn px-1.5 py-0.5 rounded text-[10px] bg-white border border-ink-200 text-ink-600 hover:bg-ink-50 font-mono" data-ratio="1:1">1:1</button>
            <button class="crop-ratio-btn px-1.5 py-0.5 rounded text-[10px] bg-white border border-ink-200 text-ink-600 hover:bg-ink-50 font-mono" data-ratio="match1">原大</button>
          </div>

          <div class="h-3 w-px bg-ink-200"></div>

          <button id="btnResetView" title="缩放居中" class="px-1.5 py-0.5 rounded bg-white hover:bg-ink-50 text-[10px] font-mono text-ink-700 border border-ink-200">
            <span id="zoomPercent">100%</span>
          </button>
        </div>
      </div>

      <!-- Main Canvas Viewport -->
      <div id="viewportWrap" class="flex-1 min-h-0 relative overflow-hidden canvas-bg-pattern flex items-center justify-center cursor-default">
        <canvas id="mainCanvas" class="block w-full h-full"></canvas>

        <!-- 1. 浮动富文本排版卡片 -->
        <div id="textRichCard" class="hidden absolute top-3.5 right-6 bg-white/95 backdrop-blur-sm border border-ink-200 rounded-lg shadow-md px-3 py-1.5 flex items-center gap-2.5 z-30 text-xs transition-all">
          <select id="fontFamilySelect" class="border border-ink-200 rounded px-1.5 py-0.5 bg-white text-[11px] outline-none text-ink-800 hover:border-ink-400 transition cursor-pointer">
            <option value="-apple-system, sans-serif">无衬线 (Sans)</option>
            <option value="Georgia, serif">人文衬线 (Serif)</option>
            <option value="ui-monospace, monospace">等宽代码 (Mono)</option>
            <option value="Impact, sans-serif">展示黑体 (Display)</option>
          </select>

          <select id="fontWeightSelect" class="border border-ink-200 rounded px-1.5 py-0.5 bg-white text-[11px] outline-none text-ink-800 hover:border-ink-400 transition cursor-pointer" title="调节字体粗细字重">
            <option value="100">100 极细</option>
            <option value="300">300 细体</option>
            <option value="400">400 常规</option>
            <option value="500">500 中等</option>
            <option value="700" selected>700 加粗</option>
            <option value="900">900 特粗</option>
          </select>

          <button id="btnTextItalic" class="w-5 h-5 rounded italic font-serif border border-ink-200 hover:bg-ink-100 text-ink-700 transition flex items-center justify-center text-xs" title="斜体">I</button>

          <div class="flex items-center gap-1">
            <span class="text-[11px] text-ink-400">字号:</span>
            <input id="fontSizeInput" type="number" value="24" min="10" max="180" class="w-11 border border-ink-200 rounded px-1 py-0.5 bg-white text-center font-mono text-[11px] outline-none">
            <span class="text-[10px] text-ink-400">px</span>
          </div>

          <div class="flex items-center gap-1" title="字体颜色">
            <span class="text-[11px] text-ink-400">颜色:</span>
            <div class="relative w-5 h-5 rounded overflow-hidden border border-ink-300 flex items-center justify-center cursor-pointer shadow-sm">
              <input type="color" id="textColorPicker" value="#0f172a" class="absolute -inset-2 w-8 h-8 opacity-0 cursor-pointer">
              <div id="textColorSwatch" class="w-full h-full bg-[#0f172a]"></div>
            </div>
          </div>

          <div class="h-3 w-px bg-ink-200 mx-0.5"></div>

          <div class="flex items-center gap-1.5" title="字体外描边">
            <label class="inline-flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="strokeToggle" class="w-3.5 h-3.5 rounded border-ink-300 text-ink-900 focus:ring-0">
              <span class="text-[11px] text-ink-700">描边</span>
            </label>
            <div id="strokeControlsWrap" class="flex items-center gap-1 opacity-40 pointer-events-none">
              <div class="relative w-4 h-4 rounded overflow-hidden border border-ink-300 flex items-center justify-center cursor-pointer shadow-sm">
                <input type="color" id="strokeColorPicker" value="#ffffff" class="absolute -inset-2 w-8 h-8 opacity-0 cursor-pointer">
                <div id="strokeColorSwatch" class="w-full h-full bg-white"></div>
              </div>
              <input id="strokeWidthInput" type="number" value="3" min="1" max="20" class="w-9 border border-ink-200 rounded px-0.5 py-0.5 bg-white text-center font-mono text-[10px] outline-none" title="描边粗细 (px)">
              <span class="text-[9px] text-ink-400">px</span>
            </div>
          </div>

          <button id="btnCloseTextBar" class="p-1 text-ink-400 hover:text-ink-800 transition ml-0.5" title="收起文字面板">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- 2. 浮动绘图工具栏 -->
        <div id="drawingToolbarCard" class="hidden absolute top-3.5 right-6 bg-white/95 backdrop-blur-sm border border-ink-200 rounded-lg shadow-md px-3 py-1.5 flex items-center gap-2.5 z-30 text-xs transition-all">
          <select id="drawShapeTypeSelect" class="border border-ink-200 rounded px-1.5 py-0.5 bg-white text-[11px] outline-none text-ink-800 hover:border-ink-400 transition cursor-pointer">
            <optgroup label="线条">
              <option value="polygon">多段线</option>
              <option value="curve">平滑曲线</option>
            </optgroup>
            <optgroup label="面域">
              <option value="rect">矩形</option>
              <option value="circle">圆形</option>
            </optgroup>
          </select>

          <div id="fillOptionWrap" class="flex items-center gap-1.5 opacity-40 pointer-events-none">
            <label class="inline-flex items-center gap-1 cursor-pointer">
              <input type="checkbox" id="drawFillToggle" class="w-3.5 h-3.5 rounded border-ink-300 text-ink-900 focus:ring-0">
              <span class="text-[11px] text-ink-700">填充</span>
            </label>
            <div class="relative w-4 h-4 rounded overflow-hidden border border-ink-300 flex items-center justify-center cursor-pointer shadow-sm" title="填充颜色">
              <input type="color" id="drawFillColorPicker" value="#e2e8f0" class="absolute -inset-2 w-8 h-8 opacity-0 cursor-pointer">
              <div id="drawFillColorSwatch" class="w-full h-full bg-[#e2e8f0]"></div>
            </div>
          </div>

          <button id="drawSolidLineBtn" type="button" title="实线/虚线（对所有绘图对象生效）" class="w-6 h-6 rounded flex items-center justify-center border transition" aria-pressed="true">
            <svg id="drawSolidIcon" viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
            </svg>
            <svg id="drawDashIcon" viewBox="0 0 24 24" class="w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="3" y1="12" x2="9" y2="12"></line>
              <line x1="12" y1="12" x2="15" y2="12"></line>
              <line x1="18" y1="12" x2="21" y2="12"></line>
            </svg>
          </button>

          <button id="drawArrowBtn" type="button" title="加箭头（对开放线条生效）" class="w-6 h-6 rounded flex items-center justify-center border transition" aria-pressed="false">
            <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="19" y2="12"></line>
              <path d="M15 6l6 6-6 6"></path>
            </svg>
          </button>

          <div class="h-3 w-px bg-ink-200"></div>

          <div class="flex items-center gap-1">
            <span class="text-[11px] text-ink-400">线宽:</span>
            <input id="drawStrokeWidthInput" type="number" value="2" min="1" max="30" class="w-10 border border-ink-200 rounded px-1 py-0.5 bg-white text-center font-mono text-[11px] outline-none">
            <div class="relative w-4 h-4 rounded overflow-hidden border border-ink-300 flex items-center justify-center cursor-pointer shadow-sm" title="线条/描边颜色">
              <input type="color" id="drawStrokeColorPicker" value="#0f172a" class="absolute -inset-2 w-8 h-8 opacity-0 cursor-pointer">
              <div id="drawStrokeColorSwatch" class="w-full h-full bg-[#0f172a]"></div>
            </div>
          </div>

          <button id="btnCloseDrawBar" class="p-1 text-ink-400 hover:text-ink-800 transition ml-0.5" title="收起绘图面板">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Empty Canvas Hint -->
        <div id="canvasEmptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 pointer-events-none">

    const HANDLE_SIZE = 7;
    const TEXT_HANDLE_SIZE = 7;
    function showToast(msg, duration = 1800) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-1');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-1');
      }, duration);
    }

    function getTodayString() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}${mm}${dd}`;
    }

    function getFormattedFileName(index) {
      const dateStr = getTodayString();
      const safeProject = (state.projectName.trim() || '未命名').replace(/[\\/:*?"<>|]/g, '_');
      const seq = String(index + 1).padStart(2, '0');
      return `${dateStr}-${safeProject}-${seq}`;
    }

    function updateNamingPreview() {
      namingPreviewBadge.textContent = `命名: ${getFormattedFileName(0)}.png`;
    }

    projectTitleInput.addEventListener('input', (e) => {
      state.projectName = e.target.value.trim() || '未命名';
      updateNamingPreview();
    });

    function saveHistorySnapshot(actionName = 'Edit') {
      const snapshot = {
        name: actionName,
        projectName: state.projectName,
        frames: state.frames.map(f => ({
          id: f.id,
          name: f.name,
          mode: f.mode,
          visible: f.visible !== false,
          anchorA: f.anchorA ? { ...f.anchorA } : null,
          anchorB: f.anchorB ? { ...f.anchorB } : null,
          allowRotation: !!f.allowRotation,
          offset: { ...f.offset },
          scale: f.scale || 1.0,
          angle: f.angle || 0.0
        })),
        textItems: state.textItems.map(t => ({ ...t })),
        drawItems: state.drawItems.map(d => ({
          ...d,
          points: d.points.map(p => ({ ...p }))
        })),
        cropRect: { ...state.cropRect },
        bgColor: state.bgColor,
        activeFrameIndex: state.activeFrameIndex,
        currentPickPoint: state.currentPickPoint
      };

      state.historyStack.push(JSON.stringify(snapshot));
      if (state.historyStack.length > state.maxHistory) state.historyStack.shift();
      state.redoStack = [];
      updateUndoRedoUI();
    }

    function undo() {
      if (state.historyStack.length <= 1) return;
      const current = state.historyStack.pop();
      state.redoStack.push(current);
      restoreSnapshot(JSON.parse(state.historyStack[state.historyStack.length - 1]));
      updateUndoRedoUI();
      showToast('已撤销');
    }

    function redo() {
      if (!state.redoStack.length) return;
      const next = state.redoStack.pop();
      state.historyStack.push(next);
      restoreSnapshot(JSON.parse(next));
      updateUndoRedoUI();
      showToast('已重做');
    }

    function restoreSnapshot(snapshot) {
      if (snapshot.projectName) {
        state.projectName = snapshot.projectName;
        projectTitleInput.value = state.projectName;
        updateNamingPreview();
      }

      state.frames.forEach((frame, idx) => {
        const saved = snapshot.frames[idx];
        if (saved) {
          frame.mode = saved.mode || '1point';
          frame.visible = saved.visible !== false;
          frame.anchorA = saved.anchorA ? { ...saved.anchorA } : null;
          frame.anchorB = saved.anchorB ? { ...saved.anchorB } : null;
          frame.allowRotation = !!saved.allowRotation;
          frame.offset = { ...saved.offset };
          frame.scale = saved.scale || 1.0;
          frame.angle = saved.angle || 0.0;
        }
      });

      state.textItems = snapshot.textItems ? snapshot.textItems.map(t => ({ ...t })) : [];
      state.drawItems = snapshot.drawItems ? snapshot.drawItems.map(d => ({
        ...d,
        points: d.points.map(p => ({ ...p }))
      })) : [];
      state.cropRect = { ...snapshot.cropRect };
      setBackdropColor(snapshot.bgColor);
      state.activeFrameIndex = Math.min(snapshot.activeFrameIndex, Math.max(0, state.frames.length - 1));
      state.currentPickPoint = snapshot.currentPickPoint || 'A';

      syncSidebarLayerModeUI();
      renderFrameList();
      redraw();
    }

    function updateUndoRedoUI() {
      btnUndo.disabled = (state.historyStack.length <= 1);
      btnRedo.disabled = (state.redoStack.length === 0);
    }

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.classList.contains('inline-editor-box')) return;
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.classList.contains('inline-editor-box')) return;
        e.preventDefault();
        redo();
      }
    });

    function initIngestion() {
      window.addEventListener('paste', async (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        let found = false;
        for (const item of items) {
          if (item.type.indexOf('image') !== -1) {
            const blob = item.getAsFile();
            if (blob) {
              found = true;
              await loadBlobIntoFrame(blob, `图层 ${state.frames.length + 1}`);
            }
          }
        }
        if (found) {
          saveHistorySnapshot('粘贴截图');
          showToast('已载入截图');
        }
      });

      document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async (e) => {
        if (!e.target.files.length) return;
        for (const file of e.target.files) {
          await loadBlobIntoFrame(file, file.name);
        }
        fileInput.value = '';
        saveHistorySnapshot('载入图片');
      });

      viewportWrap.addEventListener('dragover', (e) => e.preventDefault());
      viewportWrap.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          for (const file of e.dataTransfer.files) {
            if (file.type.startsWith('image/')) {
              await loadBlobIntoFrame(file, file.name);
            }
          }
          saveHistorySnapshot('拖拽导入');
        }
      });

      document.getElementById('btnClearAll').addEventListener('click', () => {
        if (!state.frames.length) return;
        state.frames = [];
        state.textItems = [];
        state.drawItems = [];
        state.activeFrameIndex = 0;
        state.cropRect = { x: 0, y: 0, w: 0, h: 0 };
        state.historyStack = [];
        state.redoStack = [];
        updateUndoRedoUI();
        syncSidebarLayerModeUI();
        renderFrameList();
        redraw();
        showToast('已清空画板');
      });
    }

    function loadBlobIntoFrame(blob, name) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const newIndex = state.frames.length;
            const newFrame = {
              id: 'frame_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
              image: img,
              name: name || `图层 ${newIndex + 1}`,
              mode: (newIndex === 0) ? '2point' : (state.frames[0]?.mode || '1point'),
              visible: true,
              anchorA: null,
              anchorB: null,
              allowRotation: false,
              offset: { x: 0, y: 0 },
              scale: 1.0,
              angle: 0.0
            };

            if (newIndex === 0) {
              state.cropRect = {
                x: 0,
                y: 0,
                w: img.naturalWidth,
                h: img.naturalHeight
              };
              resetViewCamera();
            }

            recomputeFrameTransform(newFrame);
            state.frames.push(newFrame);
            state.activeFrameIndex = newIndex;
            state.currentPickPoint = (newFrame.anchorA === null) ? 'A' : (newFrame.anchorB === null ? 'B' : 'A');

            syncSidebarLayerModeUI();
            renderFrameList();
            redraw();
            resolve();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(blob);
      });
    }

    function recomputeFrameTransform(frame) {
      if (!frame) return;
      const baseFrame = state.frames[0];
      if (!baseFrame || frame === baseFrame) {
        frame.offset = { x: 0, y: 0 };
        frame.scale = 1.0;
        frame.angle = 0.0;
        return;
      }

      const baseA = baseFrame.anchorA;
      const curA = frame.anchorA;

      if (!baseA || !curA) {
        frame.offset = { x: 0, y: 0 };
        frame.scale = 1.0;
        frame.angle = 0.0;
        return;
      }

      if (frame.mode === '1point' || !frame.anchorB || !baseFrame.anchorB) {
        frame.offset = { x: curA.x - baseA.x, y: curA.y - baseA.y };
        frame.scale = 1.0;
        frame.angle = 0.0;
      } else {
        const baseB = baseFrame.anchorB;
        const curB = frame.anchorB;

        const baseDx = baseB.x - baseA.x;
        const baseDy = baseB.y - baseA.y;
        const curDx = curB.x - curA.x;
        const curDy = curB.y - curA.y;

        const distBase = Math.hypot(baseDx, baseDy);
        const distCur = Math.hypot(curDx, curDy);
        const scale = (distCur > 0.0001) ? (distBase / distCur) : 1.0;

        let angle = 0;
        if (frame.allowRotation) {
          const angleBase = Math.atan2(baseDy, baseDx);
          const angleCur = Math.atan2(curDy, curDx);
          angle = angleBase - angleCur;
        }

        frame.scale = scale;
        frame.angle = angle;
        frame.offset = { x: curA.x - baseA.x, y: curA.y - baseA.y };
      }
    }

    function baseToRawImageCoords(baseCoord, frame) {
      const baseFrame = state.frames[0];
      if (!frame || frame === baseFrame) return { x: baseCoord.x, y: baseCoord.y };

      const baseA = baseFrame?.anchorA;
      const curA = frame.anchorA;

      if (!baseA || !curA || state.currentPickPoint === 'A') {
        return { x: baseCoord.x, y: baseCoord.y };
      }

      if (frame.mode === '2point') {
        const scale = frame.scale || 1.0;
        const angle = (frame.allowRotation && frame.angle) ? frame.angle : 0;
        const vx = baseCoord.x - baseA.x;
        const vy = baseCoord.y - baseA.y;

        const cos = Math.cos(-angle);
        const sin = Math.sin(-angle);
        const rx = vx * cos - vy * sin;
        const ry = vx * sin + vy * cos;

        return {
          x: curA.x + (rx / scale),
          y: curA.y + (ry / scale)
        };
      } else {
        const dx = baseA.x - curA.x;
        const dy = baseA.y - curA.y;
        return { x: baseCoord.x - dx, y: baseCoord.y - dy };
      }
    }

    // 互斥控制：对齐模式 vs 文字工具 vs 绘图工具
    function setAppMode(mode) {
      state.isTextModeActive = (mode === 'text');

      } else if (mode === 'draw') {

        textRichCard.classList.add('hidden');
        drawingToolbarCard.classList.add('hidden');

        btnToggleDrawMode.className = 'btn-minimal inline-flex items-center gap-1 px-2 py-0.5 rounded border border-ink-200 bg-white hover:bg-ink-50 text-[11px] text-ink-700';

    // 同步文字排版工具栏参数
    function syncTextToolbarValues() {

    function syncSidebarLayerModeUI() {

        btnMode2Point.className = (activeFrame.mode === '2point') ? 'py-1 rounded font-medium text-center transition bg-white text-ink-900 shadow-sm' : 'py-1 rounded font-medium text-center transition text-ink-500 hover:text-ink-900';

        btnMode1Point.className = (activeFrame.mode === '1point') ? 'py-1 rounded font-medium text-center transition bg-white text-ink-900 shadow-sm' : 'py-1 rounded font-medium text-center transition text-ink-500 hover:text-ink-900';
        btnMode2Point.className = (activeFrame.mode === '2point') ? 'py-1 rounded font-medium text-center transition bg-white text-ink-900 shadow-sm' : 'py-1 rounded font-medium text-center transition text-ink-500 hover:text-ink-900';

    btnGoSetBasePointB.addEventListener('click', () => {

    });

    btnMode1Point.addEventListener('click', () => {

    btnMode2Point.addEventListener('click', () => {
      setAppMode('align');

    btnResetAnchor.addEventListener('click', () => {

    checkAllowRotation.addEventListener('change', (e) => {
      const activeFrame = state.frames[state.activeFrameIndex];
      if (!activeFrame) return;

      saveHistorySnapshot('切换旋转');
      syncSidebarLayerModeUI();
